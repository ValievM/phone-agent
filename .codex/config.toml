# Project-scoped MCP override for Codex CLI (trusted projects only, see
# ~/.codex/config.toml, [projects."<путь>"] trust_level = "trusted").
# Context7 глобально выключен (~/.codex/config.toml); здесь, только для phone-agent,
# включён обратно. Файл в git, чтобы применялся во всех worktree этого репозитория
# одинаково. Подробности: docs/tooling/context7.md.

[mcp_servers.context7]
enabled = true
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
