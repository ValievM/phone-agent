# Project-scoped MCP override for Codex CLI (trusted projects only — see
# ~/.codex/config.toml, [projects."<путь>"] trust_level = "trusted").
# Serena и Context7 глобально выключены (~/.codex/config.toml); здесь, только для
# phone-agent, включены обратно. Файл в git, чтобы применялся во всех worktree
# этого репозитория одинаково. Решение и причина: docs/tooling/serena-context7.md.

[mcp_servers.serena]
enabled = true
startup_timeout_sec = 15
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]

[mcp_servers.context7]
enabled = true
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
